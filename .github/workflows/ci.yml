name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # Types, lint, and a real Metro bundle for every platform.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm demo:check
      - run: npx expo export --platform ios --platform android --platform web --output-dir /tmp/expo-export
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
