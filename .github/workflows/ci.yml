name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # The migrations build exactly prisma/schema.prisma (catches a schema
  # change without its migration), on a throwaway Postgres.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/migrate.mjs
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code


  # Types, lint, and a real Metro bundle for every platform.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm demo:check
      - run: npx expo export --platform ios --platform android --platform web --output-dir /tmp/expo-export
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
